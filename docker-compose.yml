# NovaRent: API + interfaz web + PostgreSQL (y pruebas con el perfil "tests").
#   cp .env.example .env     (opcional: cambia la contraseña)
#   docker compose up --build                              -> app en http://localhost:8000
#   docker compose --profile tests run --rm tests          -> pruebas contra PostgreSQL
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novarent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar}
      POSTGRES_DB: ${POSTGRES_DB:-novarent}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-novarent} -d ${POSTGRES_DB:-novarent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-novarent}:${POSTGRES_PASSWORD:-cambiar}@db:5432/${POSTGRES_DB:-novarent}
    ports:
      - "${WEB_PORT:-8000}:8000"

  db-test:
    image: postgres:16
    profiles: ["tests"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: novarent_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d novarent_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  tests:
    build:
      context: .
      target: test
    profiles: ["tests"]
    depends_on:
      db-test:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@db-test:5432/novarent_test

volumes:
  pgdata: