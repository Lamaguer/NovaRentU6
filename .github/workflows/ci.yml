name: CI NovaRent
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      TEST_DATABASE_URL: postgresql+psycopg://novarent:novarent@localhost:5432/novarent_test
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: novarent
          POSTGRES_PASSWORD: novarent
          POSTGRES_DB: novarent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novarent" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check src tests
      - run: python -m pytest -v --cov=src --cov-report=term-missing --cov-fail-under=80
